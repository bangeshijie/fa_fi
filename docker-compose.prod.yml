services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    env_file:
      - ./backend/env/.env.prod
    volumes:
      - postgres18-data:/var/lib/postgresql
    networks:
      - app-network
    restart: unless-stopped
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m

  redis:
    image: redis:8.10.0-alpine
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      TZ: Asia/Shanghai
    env_file:
      - ./backend/env/.env.prod
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 128mb
        --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 128m

  alembic-migration:
    build:
      context: ./backend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - ./backend/env/.env.prod
    environment:
      APP_ENV: prod
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"
    mem_limit: 512m

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - ./backend/env/.env.prod
    environment:
      APP_ENV: prod
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/code/static/upload
      - download-data:/code/static/download
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic-migration:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: unless-stopped
    command:
      - uv
      - run
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/common/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m

networks:
  app-network:
    driver: bridge

volumes:
  postgres18-data:
    driver: local
  redis-data:
    driver: local
  upload-data:
    driver: local
  download-data:
    driver: local
