# Install as /etc/nginx/conf.d/fa_fi_ms.conf after replacing the old site's config.
# The symlink /opt/fa_fi_ms/frontend-current must point to a complete dist directory.

server {
    listen 80;
    listen [::]:80;
    server_name chyichyi.com www.chyichyi.com;
    return 301 https://www.chyichyi.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chyichyi.com;

    ssl_certificate /etc/nginx/ssl/fa_fi_ms/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/fa_fi_ms/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/fa_fi_ms/frontend-current;
    index index.html;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /health {
        proxy_pass http://127.0.0.1:8002/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chyichyi.com;

    ssl_certificate /etc/nginx/ssl/fa_fi_ms/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/fa_fi_ms/privkey.pem;
    return 301 https://www.chyichyi.com$request_uri;
}
