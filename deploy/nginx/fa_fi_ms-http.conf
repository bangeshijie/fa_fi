# Bootstrap configuration used only before the first Let's Encrypt certificate.
# Replace it with fa_fi_ms.conf after certbot has issued the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name chyichyi.com www.chyichyi.com;

    root /opt/fa_fi_ms/frontend-current;
    index index.html;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
